<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonetos</title>

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/app.js" type="module"></script>
</head>

<body>
    <header class="cabecera">
        <h1>Sonetos</h1>
    </header>

    <main>
        <section class="selector">
            <label class="selector__label">
                Soneto
                <select class="selector__select"></select>
            </label>
        </section>

        <article class="soneto">
            <header class="soneto__header">
                <h2 class="soneto__titulo"></h2>
                <p class="soneto__autor"></p>
            </header>
            
            <div class="soneto__contenido"></div>
        </article>
    </main>
</body>

</html>
